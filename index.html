<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tetris Game</title>

  <!-- Blockrain stylesheet from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Aerolab/blockrain.js/dist/blockrain.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 1.5em;
      font-weight: 600;
    }

    p.instructions {
      margin: 0 0 20px 0;
      max-width: 400px;
      font-size: 0.95em;
      line-height: 1.4em;
      color: #ccc;
    }

    .game {
      width: 300px;
      height: 600px;
    }
  </style>
</head>
<body>

  <h2>Tetris Game</h2>
  <p class="instructions">
    Use the arrow keys to move the falling blocks.  
    Try to complete full horizontal lines to score points.  
  </p>

  <div class="game"></div>

  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

  <!-- Blockrain plugin from CDN -->
  <script src="https://cdn.jsdelivr.net/gh/Aerolab/blockrain.js/dist/blockrain.jquery.js"></script>

  <script>
    $(function () {
      $('.game').blockrain({
        theme: 'modern',      // your chosen theme
        autoplay: false,      // participants play manually
        difficulty: 'normal',
        speed: 20,
        showFieldOnStart: true
      });
    });
  </script>
</body>
</html>
