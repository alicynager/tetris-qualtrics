<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tetris Game</title>

  <!-- Blockrain stylesheet -->
  <link rel="stylesheet" href="src/blockrain.css">

  <!-- jQuery and Blockrain -->
  <script src="src/blockrain.jquery.libs.js"></script>
  <script src="src/blockrain.jquery.src.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .game {
      width: 300px;
      height: 600px;
    }
  </style>
</head>

<body>
  <div class="game"></div>

  <script>
    $('.game').blockrain({
      theme: 'modern',      // your preference
      autoplay: false,      // participants play manually
      difficulty: 'normal',
      speed: 20,
      showFieldOnStart: true
    });
  </script>
</body>
</html>
